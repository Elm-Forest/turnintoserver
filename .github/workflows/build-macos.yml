name: Build macOS app

on:
  push:
    branches: [main, 'maintenance/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -list -project turnintoserver.xcodeproj
      - name: Build unsigned app
        run: |
          set -eo pipefail
          xcodebuild build \
            -project turnintoserver.xcodeproj \
            -scheme turnintoserver \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO
      - name: Package
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/turnintoserver.app"
          test -d "$APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/turnintoserver-unsigned.zip"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnintoserver-macos-unsigned
          path: ${{ runner.temp }}/turnintoserver-unsigned.zip
          retention-days: 7
